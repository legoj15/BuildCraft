# Properties from NeoForge 26.1 MDK
org.gradle.jvmargs=-Xmx3G
# Daemon ON — deliberately diverges from the MDK's `=false`. A persistent daemon keeps the JVM
# warm across invocations (~5.7x faster no-op builds: ~7.7s single-use fork -> ~1.7s reused); the
# MDK disables it only as a conservative low-RAM/newcomer default, not worth the per-build
# cold-start cost on a dev workstation. `gradlew --stop` clears daemons if one ever misbehaves.
org.gradle.daemon=true

# ─── Shared across ALL Stonecutter nodes — edit these here ───────────────────
# Every VERSION PIN (minecraft_version, neo_version, jei_version, neo_dep_range, mc_dep_range) lives
# PER-NODE in versions/<node>/gradle.properties, and the per-node build reads only those. Do NOT add a
# copy of any pin here: the build would ignore it (each node's own file wins) and it would only drift.
# The keys below are the genuinely shared ones — a node inherits each unless it overrides it in its
# own file. Tooling that needs "which node is primary / which node to deploy" derives it elsewhere
# (release/config/release.json -> primaryNode); it is deliberately NOT mirrored here anymore.

# CalVer mod version — intentionally independent of the Minecraft version. ONE edit here updates every
# node's jar filename + mods.toml version (no node overrides it). The release/deploy tooling reads it
# from here too.
mod_version=2026.2.0-br3

# Default Java toolchain. The pre-CalVer nodes (1.21.x) override this to 21 in their own props; the
# 26.x nodes carry no java_version and inherit this 25.
java_version=25

# Git branch hosting the published BuildCraftVersions.json (the in-game update check reads it).
update_branch=main
