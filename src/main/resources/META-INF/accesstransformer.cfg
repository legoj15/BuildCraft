# BuildCraft Access Transformer, read by NeoForge and by MinecraftForge (ForgeGradle 7 hands this same file to the mavenizer)
# Opens internal recipe fields for guide book recipe display

# ShapedRecipe — pattern is also in the block of NeoForge's own members below; here we need result
public net.minecraft.world.item.crafting.ShapedRecipe result # result

# ShapelessRecipe — need result and ingredients
public net.minecraft.world.item.crafting.ShapelessRecipe result # result
public net.minecraft.world.item.crafting.ShapelessRecipe ingredients # ingredients

# SingleItemRecipe — contains result for all cooking/smelting recipes
public net.minecraft.world.item.crafting.SingleItemRecipe result # result
public net.minecraft.world.item.crafting.SingleItemRecipe input # input

# AbstractCookingRecipe — try input field (may be 'ingredient' or 'input')
public net.minecraft.world.item.crafting.AbstractCookingRecipe input # input

# BlockModelWrapper — access render properties for pipe item colour overlays
public net.minecraft.client.renderer.item.BlockModelWrapper properties # properties


# Fluid Flow Overrides
public net.minecraft.world.level.material.FlowingFluid canPassThroughWall
public net.minecraft.world.level.material.FlowingFluid canPassThrough
public net.minecraft.world.level.material.FlowingFluid spreadToSides

# ItemCooldowns — FakePlayerUtil clears a cached fake player's cooldowns (a never-ticked player's never expire)
public net.minecraft.world.item.ItemCooldowns cooldowns # cooldowns

# ClientChunkCache — the Zone Planner map clips its terrain scan to the chunks the client can hold (ClientLoadedChunks)
public net.minecraft.client.multiplayer.ClientChunkCache$Storage
public net.minecraft.client.multiplayer.ClientChunkCache storage # storage
public net.minecraft.client.multiplayer.ClientChunkCache$Storage chunkRadius # chunkRadius
public net.minecraft.client.multiplayer.ClientChunkCache$Storage viewCenterX # viewCenterX
public net.minecraft.client.multiplayer.ClientChunkCache$Storage viewCenterZ # viewCenterZ

# CompoundContainer — 1.21.1's classic item views resolve a double chest's slot to its half (ClassicSlotLedger)
public net.minecraft.world.CompoundContainer container1 # container1
public net.minecraft.world.CompoundContainer container2 # container2

# Members NeoForge's own access transformer already opens (identical lines on every NeoForge line BC builds), listed here
# because MinecraftForge's does not: the shared source reads them, so a Forge build only compiles with them opened by BC.
# A line is a no-op on a NeoForge node.
public net.minecraft.client.gui.screens.recipebook.GhostSlots setInput(Lnet/minecraft/world/inventory/Slot;Lnet/minecraft/util/context/ContextMap;Lnet/minecraft/world/item/crafting/display/SlotDisplay;)V # setInput
public net.minecraft.client.gui.screens.recipebook.GhostSlots setResult(Lnet/minecraft/world/inventory/Slot;Lnet/minecraft/util/context/ContextMap;Lnet/minecraft/world/item/crafting/display/SlotDisplay;)V # setResult
public net.minecraft.world.item.crafting.ShapedRecipe pattern # pattern
