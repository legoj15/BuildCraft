modLoader="javafml"
loaderVersion="[2,]"
license="MPL-2.0"
issueTrackerURL="https://github.com/legoj15/BuildCraft/issues"

[[mods]]
modId="buildcraftunofficial"
version="${mod_version}"
displayName="BuildCraft (Unofficial)"
logoFile="logo.png"
credits="Created by SpaceToad"
authors="SpaceToad, BuildCraft Team, legoj15 (1.21.1+ port)"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more!
Unofficial port to NeoForge.
'''
displayURL="https://github.com/legoj15/BuildCraft"
updateJSONURL="https://raw.githubusercontent.com/legoj15/BuildCraft/${update_branch}/BuildCraftVersions.json"

[[dependencies.buildcraftunofficial]]
    modId="neoforge"
    type="required"
    # Range is per Stonecutter node (versions/<node>/gradle.properties -> neo_dep_range). Each floor is
    # the EMPIRICAL minimum that node's jar compiles + boots against (compile-bisect + a headless server
    # boot), not a guess: set too high it needlessly gates users, too low it loads then crashes on boot.
    #   26.1.2  -> [26.1.0,26.2)    whole line — BreakBlockEvent is resolved reflectively (lib.misc.
    #                               BreakEventCompat) + GUI getters use line-wide aliases, so nothing
    #                               binds above the line's first build (369 game tests pass on 26.1.0.1)
    #   26.2    -> [26.2.0,26.3)    whole line — all 26.2 API landed atomically at 26.2.0.0-beta
    #   1.21.11 -> [21.11.42,...)   the only published build on the line
    #   1.21.10 -> [21.10.63,...)   earliest published build (one below the pin; same MC 1.21.10)
    #   1.21.1  -> [21.1.151,...)   IBCMenuProvider needs MenuProvider#writeClientSideData(menu, buf),
    #                               backported at 21.1.151 (#2138) — NOT the bottom of the 21.1 line
    versionRange="${neo_dep_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftunofficial]]
    modId="minecraft"
    type="required"
    versionRange="${mc_dep_range}"
    ordering="NONE"
    side="BOTH"
