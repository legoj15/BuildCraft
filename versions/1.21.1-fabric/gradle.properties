# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 1.21.1-fabric is the Fabric node of the 1.21.1 line: the same build as 26.3-fabric (whose file explains each pin),
# but obfuscated Minecraft, so Loom runs in remap mode (Mojang mappings, remapJar ships) and Java 21.
# Its class tweaker is buildcraftunofficial-named.classtweaker beside this file (Mojang names, 1.21.1 members).
loader=fabric
minecraft_version=1.21.1
java_version=21
fabric_loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1
fabric_loader_dep_range=>=0.16.0
fabric_api_dep_range=>=0.116.17+1.21.1
# Forge Config API Port 21.1.6 for Fabric (Modrinth version id).
forge_config_api_port_version=N5qzq0XV
forge_config_api_port_dep_range=>=21.1.6
# The NeoForge 1.21.1 node's pin (JEI's 1.21.1 LTS branch); its fabric-api artifact exists at the same build.
jei_version=19.27.0.340
rei_version=16.0.799
# REI 16's POM names no basic-math; the pin only keeps the shared compileOnly line resolvable.
rei_basic_math_version=0.6.1
rei_architectury_version=13.0.6
mod_menu_version=11.0.5
team_reborn_energy_version=4.1.0
# Common Protection API 2.0.0 targets Java 25; 1.0.0 is the Java-21 build.
common_protection_api_version=1.0.0
common_protection_api_dep_range=>=1.0.0
