# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 1.21.1-fabric is the Fabric node of the 1.21.1 line: the same build as 26.3-fabric (whose file explains each pin),
# but obfuscated Minecraft, so Loom runs in remap mode (Mojang mappings, remapJar ships) and Java 21.
# Its class tweaker is buildcraftunofficial-named.classtweaker beside this file (Mojang names, 1.21.1 members).
loader=fabric
minecraft_version=1.21.1
java_version=21
fabric_loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1
fabric_loader_dep_range=>=0.16.0
fabric_api_dep_range=>=0.116.17+1.21.1
# Forge Config API Port 21.1.6 for Fabric (Modrinth version id).
forge_config_api_port_version=N5qzq0XV
forge_config_api_port_dep_range=>=21.1.6
# The NeoForge 1.21.1 node's pin (JEI's 1.21.1 LTS branch); its fabric-api artifact exists at the same build.
jei_version=19.27.0.340
rei_version=16.0.799
# REI 16's POM names no basic-math; the pin only keeps the shared compileOnly line resolvable.
rei_basic_math_version=0.6.1
rei_architectury_version=13.0.6
mod_menu_version=11.0.5
team_reborn_energy_version=4.1.0
# Common Protection API 2.0.0 targets Java 25; 1.0.0 is the Java-21 build.
common_protection_api_version=1.0.0
common_protection_api_dep_range=>=1.0.0

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac fabric-1.21.1-0.33.0, flan 1.21.1-1.12.8-fabric, energizedpower 3.0.7+1.21.1-fabric,
# techreborn 5.11.19, reborncore 5.11.19, tomsstorage 1.21-2.4.2-fabric, extendeddrawers 3.0.4+mc.1.21.1,
# lithium mc1.21.1-0.15.4-fabric, sodium mc1.21.1-0.8.13-fabric, iris 1.8.14-beta.1+1.21.1-fabric,
# immediatelyfast 1.6.15+1.21.1-fabric, c2me 0.4.0-alpha.0.30+1.21.1
# This node remaps mods (Loom), which drops their jar-in-jar libraries; the build unpacks and adds them itself
# (WithMods.nestedJars), so an alias lists only what is published as a separate artifact (a separate mod, as Reborn Core).
# tre (Team Reborn Energy) is already on this node's dev runtime (modLocalRuntime), so its alias is a deliberate no-op.
withmod.opac=maven.modrinth:open-parties-and-claims:4XHYA7yQ
withmod.flan=maven.modrinth:flan:1SJYtmxm
withmod.energizedpower=maven.modrinth:energized-power:xnhE9e7w
withmod.techreborn=maven.modrinth:techreborn:CNwZZ4FD;maven.modrinth:reborncore:QtkC5plA
withmod.tomsstorage=maven.modrinth:toms-storage:nhRuPk5W
withmod.extendeddrawers=maven.modrinth:extended-drawers:7ayZB1fH
withmod.lithium=maven.modrinth:lithium:N08Z8wog
withmod.sodium=maven.modrinth:sodium:SMxNOGZ6
withmod.iris=maven.modrinth:iris:bAo1Qhte;maven.modrinth:sodium:SMxNOGZ6
withmod.immediatelyfast=maven.modrinth:immediatelyfast:aLnBqxFW
withmod.c2me=maven.modrinth:c2me-fabric:KxcgERSN
withmod.tre=
