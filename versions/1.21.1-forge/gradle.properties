# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 1.21.1-forge is the MinecraftForge port's second node (#209, docs/forge-port.md, slice F7): the same build as 26.3-forge
# (whose file explains each pin) on the 1.21.1 line, Forge 52 (EventBus 6). This is MinecraftForge, NOT NeoForge (the bare
# 1.21.1 node). It compiles all of src/main/java bar the REI plugin packages (REI has no Forge build for 1.21.1; JEI's
# plugins compile against jei_version below). Dev runs: :1.21.1-forge:runClient (the client, F7b; JEI loads unless
# -Precipe_viewer=none), :1.21.1-forge:runServer boots the dedicated server, :1.21.1-forge:runGameTest runs the shared game
# tests.
loader=forge

# 1.21.1 is the pre-CalVer line: Java 21, like the bare 1.21.1 and 1.21.1-fabric nodes.
java_version=21

# minecraft_version = the MC version ForgeGradle's mavenizer builds Forge against. Forge 52 runs Mojang's official names at
# runtime (no reobfuscation), so the shared source compiles against it as written, as on 26.3-forge.
minecraft_version=1.21.1
# forge_version = the dev COMPILE build of MinecraftForge 1.21.1 (the newest 52.1.x build on 2026-11-16; McDevBridge's
# 1.21.1-forge node pins the same). Not a player-facing requirement (that is forge_version_range below).
forge_version=52.1.21
# The player-facing minimums the shipped mods.toml declares: Forge 52.1.x (52.1.0 is the first non-0.x build of the line;
# not yet bisected upward), the FML language-provider version (Forge's major number) and the Minecraft line.
forge_version_range=[52.1.0,53)
forge_loader_version_range=[52,)
mc_dep_range=[1.21.1,1.21.2)
# jei_version = JEI's 1.21.1 LTS branch, the same build the bare 1.21.1 node pins (JEI publishes its Forge and NeoForge jars
# from one source and version; artifacts jei-1.21.1-forge and jei-1.21.1-forge-api on maven.blamejared.com).
jei_version=19.27.0.340
# Forge 52's Minecraft#onGameLoadFinished patch runs a --quickPlaySingleplayer world load BEFORE ClientModLoader starts
# MinecraftForge.EVENT_BUS, so every game-bus post during that load is dropped (Forge's own AddReloadListenerEvent among
# them: the integrated server then crashes at the first loot roll, "Can not retrieve LootModifierManager until resources
# have loaded once"). Not BuildCraft's; every Forge 1.21.1 mod meets it. The smoke runner reads this key and opens its save
# through Singleplayer instead; -PbcQuickPlay warns.
quickplay_drops_game_events=true
# pack_fields = the pack-format member of the jar's own pack.mcmeta: 1.21.1 takes a plain pack_format (its version.json says
# resources 34, data 48; a mod's own metadata only has to parse, so McDevBridge's 1.21.1-forge node carries 34 as well).
pack_fields="pack_format": 34

# withmod.opac = the Open Parties and Claims build the shared source compiles against on this node (its Forge build for the
# 1.21.1 line, forge-1.21.1-0.33.0; lib.compat.claims.OpenPartiesAndClaims, pulled into the compile for ForgeProtection), and what
# `-PwithMods=opac` puts on the dev runtime. That build declares Forge Config API Port (forgeconfigapiport, [21.0.5,)) as a mandatory
# dependency and Forge ships none, so the alias carries its Forge build too (21.1.6). The first coordinate is the compile pin.
withmod.opac=maven.modrinth:open-parties-and-claims:3W7VB9lw;maven.modrinth:forge-config-api-port:uz2Elwpw
