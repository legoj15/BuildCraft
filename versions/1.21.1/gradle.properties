# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 21.1 LTS line (the SessionStart
# hook flags when it's behind — bumping is routine). It is NOT the player-facing requirement, which is
# neo_dep_range below (note the gap: the pin is ~80+ builds above the 21.1.151 floor). minecraft_version
# = target MC + jar "+mc" filename tag; jei_version = 19.27.x is JEI's 1.21.1 LTS branch (the modern
# 26.x JEI needs MC 1.21.10+, so this node stays on the older JEI line).
minecraft_version=1.21.1
neo_version=21.1.265
jei_version=19.27.0.340
# guideme_version = the GuideME build for that MC, loaded only by dev runs given -PwithGuideMe.
guideme_version=21.1.20
rei_version=16.0.799
architectury_version=13.0.11

# 1.21.1 is the NeoForge LTS line (Java 21), far below three modern cliffs this node
# sits beneath: item-model definitions (MC 1.21.4), the modern render pipeline (MC 1.21.5),
# and NeoForge's Transfer API / ResourceHandler (NeoForge 21.9+). Like the 1.21.10 node it is
# < 1.21.11, so it inherits the tree-wide ResourceLocation<-Identifier + RenderType-package
# replacements; the deeper cliffs are expressed as //? if directives in the shared source tree.
java_version=21

# This node ships as the 1.21.1 jar (the NeoForge LTS line). The neo floor is NOT the bottom of the
# 21.1 line: the spectator-safe menu shim (lib.gui.IBCMenuProvider) overrides
# MenuProvider#writeClientSideData(AbstractContainerMenu, RegistryFriendlyByteBuf), whose 2-arg form
# was backported to 1.21.1 at 21.1.151 (#2138). Verified empirically by compile-bisect (21.1.151
# compiles, 21.1.150 fails on that @Override) + a clean dedicated-server boot at 21.1.151. Below it,
# FML cleanly blocks the mod ("update NeoForge") instead of the jar loading then crashing. (The
# c:tools/wrench tag Tags.Items.TOOLS_WRENCH @21.1.103 is a lower, non-binding constraint.) MC is
# 1.21.1 across the WHOLE 21.1 line, so mc_dep_range is unaffected.
neo_dep_range=[21.1.151,21.2)
mc_dep_range=[1.21.1,1.21.2)
# curios_version / accessories_version: the accessory-slot mods compiled against (BC's AccessorySlots); Accessories has no build past 1.21.10.
curios_version=9.5.1+1.21.1
accessories_version=1.1.0-beta.54+1.21.1

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac neoforge-1.21.1-0.33.0, flan 1.21.1-1.12.8-neoforge, energizedpower 3.0.7+1.21.1-neoforge,
# tomsstorage 1.21-2.4.2, lithium mc1.21.1-0.15.4-neoforge, sodium mc1.21.1-0.8.13-neoforge,
# iris 1.8.14-beta.1+1.21.1-neoforge, immediatelyfast 1.6.15+1.21.1-neoforge, ftbchunks 2101.1.24
# ftbchunks (maven.ftb.dev) is FTB Chunks with FTB Library and FTB Teams, the builds its POM names, plus Architectury where
# the line needs it. The neoforge jars are self-contained: FTB's common jars are merged into them (listing both would
# put every class on the classpath twice) and the libraries ride inside FTB Library.
withmod.opac=maven.modrinth:open-parties-and-claims:yWmXD7GW
withmod.flan=maven.modrinth:flan:Z6X7Mj4L
withmod.energizedpower=maven.modrinth:energized-power:OvHVUruL
withmod.tomsstorage=maven.modrinth:toms-storage:WQAMoIMC
withmod.lithium=maven.modrinth:lithium:DDUrRVCA
withmod.sodium=maven.modrinth:sodium:uMOpc5uV
withmod.iris=maven.modrinth:iris:KduFYu4t;maven.modrinth:sodium:uMOpc5uV
withmod.immediatelyfast=maven.modrinth:immediatelyfast:EJzmEPZV
withmod.ftbchunks=dev.ftb.mods:ftb-chunks-neoforge:2101.1.24;dev.ftb.mods:ftb-library-neoforge:2101.1.39;dev.ftb.mods:ftb-teams-neoforge:2101.1.9;dev.architectury:architectury-neoforge:13.0.11
