# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 21.1 LTS line (the SessionStart
# hook flags when it's behind — bumping is routine). It is NOT the player-facing requirement, which is
# neo_dep_range below (note the gap: the pin is ~80+ builds above the 21.1.151 floor). minecraft_version
# = target MC + jar "+mc" filename tag; jei_version = 19.27.x is JEI's 1.21.1 LTS branch (the modern
# 26.x JEI needs MC 1.21.10+, so this node stays on the older JEI line).
minecraft_version=1.21.1
neo_version=21.1.250
jei_version=19.27.0.340

# 1.21.1 is the NeoForge LTS line (Java 21), far below three modern cliffs this node
# sits beneath: item-model definitions (MC 1.21.4), the modern render pipeline (MC 1.21.5),
# and NeoForge's Transfer API / ResourceHandler (NeoForge 21.9+). Like the 1.21.10 node it is
# < 1.21.11, so it inherits the tree-wide ResourceLocation<-Identifier + RenderType-package
# replacements; the deeper cliffs are expressed as //? if directives in the shared source tree.
java_version=21

# This node ships as the 1.21.1 jar (the NeoForge LTS line). The neo floor is NOT the bottom of the
# 21.1 line: the spectator-safe menu shim (lib.gui.IBCMenuProvider) overrides
# MenuProvider#writeClientSideData(AbstractContainerMenu, RegistryFriendlyByteBuf), whose 2-arg form
# was backported to 1.21.1 at 21.1.151 (#2138). Verified empirically by compile-bisect (21.1.151
# compiles, 21.1.150 fails on that @Override) + a clean dedicated-server boot at 21.1.151. Below it,
# FML cleanly blocks the mod ("update NeoForge") instead of the jar loading then crashing. (The
# c:tools/wrench tag Tags.Items.TOOLS_WRENCH @21.1.103 is a lower, non-binding constraint.) MC is
# 1.21.1 across the WHOLE 21.1 line, so mc_dep_range is unaffected.
neo_dep_range=[21.1.151,21.2)
mc_dep_range=[1.21.1,1.21.2)
