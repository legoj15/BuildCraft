# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 1.21.10-fabric is the Fabric node of the 1.21.10 line: the same build as 26.3-fabric (whose file explains each pin),
# but obfuscated Minecraft, so Loom runs in remap mode (Mojang mappings, remapJar ships) and Java 21.
# Its class tweaker is buildcraftunofficial-named.classtweaker beside this file (Mojang names, 1.21.10 members).
loader=fabric
minecraft_version=1.21.10
java_version=21
fabric_loader_version=0.20.1
fabric_api_version=0.138.4+1.21.10
fabric_loader_dep_range=>=0.19.4
fabric_api_dep_range=>=0.138.4+1.21.10
# Forge Config API Port 21.10.1 for Fabric (Modrinth version id).
forge_config_api_port_version=IKHTwwTv
forge_config_api_port_dep_range=>=21.10.1
jei_version=26.2.0.30
rei_version=21.9.813
rei_basic_math_version=0.6.1
rei_architectury_version=18.0.3
mod_menu_version=16.0.1
team_reborn_energy_version=4.2.0
# Common Protection API 2.0.0 targets Java 25; 1.0.0 is the Java-21 build.
common_protection_api_version=1.0.0
common_protection_api_dep_range=>=1.0.0

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac fabric-1.21.10-0.33.0, flan 1.21.10-1.12.5-fabric, energizedpower 1.21.10-2.15.9-fabric,
# tomsstorage 1.21.10-2.7.0-fabric, extendeddrawers 4.3.0-beta.2+mc.1.21.10, lithium mc1.21.10-0.20.1-fabric,
# sodium mc1.21.10-0.7.3-fabric, iris 1.9.7+1.21.10-fabric, immediatelyfast 1.13.6+1.21.10-fabric,
# c2me 0.3.6+alpha.0.11+1.21.10
# This node remaps mods (Loom), which drops their jar-in-jar libraries; the build unpacks and adds them itself
# (WithMods.nestedJars), so an alias lists only what is published as a separate artifact (a separate mod, as Reborn Core).
# tre (Team Reborn Energy) is already on this node's dev runtime (modLocalRuntime), so its alias is a deliberate no-op.
withmod.opac=maven.modrinth:open-parties-and-claims:DO9BSzgA
withmod.flan=maven.modrinth:flan:Tp7svqko
withmod.energizedpower=maven.modrinth:energized-power:EGs11xOV
withmod.tomsstorage=maven.modrinth:toms-storage:Gk2tI0ZM
withmod.extendeddrawers=maven.modrinth:extended-drawers:GSwllSSb
withmod.lithium=maven.modrinth:lithium:NsswKiwi
withmod.sodium=maven.modrinth:sodium:sFfidWgd
withmod.iris=maven.modrinth:iris:a98UkgML;maven.modrinth:sodium:sFfidWgd
withmod.immediatelyfast=maven.modrinth:immediatelyfast:9hztj0xA
withmod.c2me=maven.modrinth:c2me-fabric:b2odfQPM
withmod.tre=
