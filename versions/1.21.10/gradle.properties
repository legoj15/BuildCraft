# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 21.10 line (only .63 and .64
# exist; the SessionStart hook flags when it's behind). It is NOT the player-facing requirement, which
# is neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=1.21.10
neo_version=21.10.64
jei_version=26.2.0.30
# guideme_version = the GuideME build for that MC, loaded only by dev runs given -PwithGuideMe.
guideme_version=21.10.2-beta
rei_version=21.9.813
architectury_version=18.0.8

# 1.21.10 is pre-CalVer (Java 21), one patch below 1.21.11. This node exists for the
# 1.21.10-specific cliffs vs the 1.21.11 node: chiefly Mojang's ResourceLocation->Identifier
# rename (which landed AT 1.21.11 — reversed here tree-wide via a Stonecutter regex
# replacement in build.gradle.kts) plus the older render/model-baking API shape, expressed
# as //? if directives in the shared source tree.
java_version=21

# This node ships as the 1.21.10 jar. Range covers ONLY 1.21.10 (1.21.11 is a separate node).
# Floor is the earliest published 21.10 build (21.10.63, one below the pin): both builds are MC
# 1.21.10 and the jar compiles clean against .63, so flooring at the pin would needlessly gate a
# .63 user. (Only .63 and .64 exist on this line.)
neo_dep_range=[21.10.63,21.11)
mc_dep_range=[1.21.10,1.21.11)
# curios_version / accessories_version: the accessory-slot mods compiled against (BC's AccessorySlots); Accessories has no build past 1.21.10.
curios_version=13.0.0+1.21.10
accessories_version=1.4.3-beta+1.21.10

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac neoforge-1.21.10-0.33.0, flan 1.21.10-1.12.5-neoforge, energizedpower 1.21.10-2.15.14-neoforge,
# tomsstorage 1.21.10-2.7.1, lithium mc1.21.10-0.20.1-neoforge, sodium mc1.21.10-0.7.3-neoforge,
# iris 1.9.7+1.21.10-neoforge, immediatelyfast 1.13.6+1.21.10-neoforge
withmod.opac=maven.modrinth:open-parties-and-claims:aw2g7Pto
withmod.flan=maven.modrinth:flan:joDxvzKU
withmod.energizedpower=maven.modrinth:energized-power:e1eEnVGs
withmod.tomsstorage=maven.modrinth:toms-storage:L2uLEsyv
withmod.lithium=maven.modrinth:lithium:HADn4LHe
withmod.sodium=maven.modrinth:sodium:PdQpfqPZ
withmod.iris=maven.modrinth:iris:aBn2niiX;maven.modrinth:sodium:PdQpfqPZ
withmod.immediatelyfast=maven.modrinth:immediatelyfast:NWeE5tOf
