# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 21.10 line (only .63 and .64
# exist; the SessionStart hook flags when it's behind). It is NOT the player-facing requirement, which
# is neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=1.21.10
neo_version=21.10.64
jei_version=26.2.0.30

# 1.21.10 is pre-CalVer (Java 21), one patch below 1.21.11. This node exists for the
# 1.21.10-specific cliffs vs the 1.21.11 node: chiefly Mojang's ResourceLocation->Identifier
# rename (which landed AT 1.21.11 — reversed here tree-wide via a Stonecutter regex
# replacement in build.gradle.kts) plus the older render/model-baking API shape, expressed
# as //? if directives in the shared source tree.
java_version=21

# This node ships as the 1.21.10 jar. Range covers ONLY 1.21.10 (1.21.11 is a separate node).
# Floor is the earliest published 21.10 build (21.10.63, one below the pin): both builds are MC
# 1.21.10 and the jar compiles clean against .63, so flooring at the pin would needlessly gate a
# .63 user. (Only .63 and .64 exist on this line.)
neo_dep_range=[21.10.63,21.11)
mc_dep_range=[1.21.10,1.21.11)
