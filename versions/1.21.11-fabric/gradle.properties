# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 1.21.11-fabric is the Fabric node of the 1.21.11 line: the same build as 26.3-fabric (whose file explains each pin),
# but obfuscated Minecraft, so Loom runs in remap mode (Mojang mappings, remapJar ships) and Java 21.
# Its class tweaker is buildcraftunofficial-named.classtweaker beside this file (Mojang names, 1.21.11 members).
loader=fabric
minecraft_version=1.21.11
java_version=21
fabric_loader_version=0.20.1
fabric_api_version=0.141.6+1.21.11
fabric_loader_dep_range=>=0.19.4
fabric_api_dep_range=>=0.141.6+1.21.11
# Forge Config API Port 21.11.1 for Fabric (Modrinth version id).
forge_config_api_port_version=uXrWPsCu
forge_config_api_port_dep_range=>=21.11.1
jei_version=27.4.0.22
rei_version=21.11.816
rei_basic_math_version=0.6.1
rei_architectury_version=19.0.1
mod_menu_version=17.0.1
team_reborn_energy_version=4.2.0
# Common Protection API 2.0.0 targets Java 25; 1.0.0 is the Java-21 build.
common_protection_api_version=1.0.0
common_protection_api_dep_range=>=1.0.0

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac fabric-1.21.11-0.33.0, flan 1.21.11-1.12.7-fabric, energizedpower 1.21.11-2.15.12-fabric,
# tomsstorage 1.21.11-2.8.0-fabric, extendeddrawers 4.3.0-beta.3+mc.1.21.11, lithium mc1.21.11-0.21.4-fabric,
# sodium mc1.21.11-0.8.15-beta.1-fabric, iris 1.10.8+1.21.11-fabric, immediatelyfast 1.14.3+1.21.11-fabric,
# c2me 0.4.0-alpha.0.28+1.21.11
# This node remaps mods (Loom), which drops their jar-in-jar libraries; the build unpacks and adds them itself
# (WithMods.nestedJars), so an alias lists only what is published as a separate artifact (a separate mod, as Reborn Core).
# tre (Team Reborn Energy) is already on this node's dev runtime (modLocalRuntime), so its alias is a deliberate no-op.
withmod.opac=maven.modrinth:open-parties-and-claims:X0LMxmt1
withmod.flan=maven.modrinth:flan:5Kz9KVo2
withmod.energizedpower=maven.modrinth:energized-power:3YoFwVm2
withmod.tomsstorage=maven.modrinth:toms-storage:FydlCSUl
withmod.extendeddrawers=maven.modrinth:extended-drawers:5lQqC26G
withmod.lithium=maven.modrinth:lithium:Ow7wA0kG
withmod.sodium=maven.modrinth:sodium:RB7CDjTS
withmod.iris=maven.modrinth:iris:ka9PDlsN;maven.modrinth:sodium:RB7CDjTS
withmod.immediatelyfast=maven.modrinth:immediatelyfast:4EwhsTu7
withmod.c2me=maven.modrinth:c2me-fabric:j1RWyU0M
withmod.tre=
