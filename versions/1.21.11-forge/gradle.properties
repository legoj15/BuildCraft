# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 1.21.11-forge is the MinecraftForge port's third node (#209, docs/forge-port.md, slice F8): the same build as 26.3-forge
# (whose file explains each pin) on the 1.21.11 line, Forge 61 (EventBus 7, the bus shape 26.3 has). This is MinecraftForge,
# NOT NeoForge (the bare 1.21.11 node). It compiles all of src/main/java bar the recipe-viewer plugin packages (no
# jei_version / rei_version: no Forge build of either is wired; of the Forge nodes only 1.21.1-forge pins one, JEI). Dev
# runs: :1.21.11-forge:runServer, runClient and runGameTest. There is never a 1.21.10 Forge node (#210).
loader=forge

# 1.21.11 is the last Java-21 / pre-CalVer line, like the bare 1.21.11 and 1.21.11-fabric nodes.
java_version=21

# minecraft_version = the MC version ForgeGradle's mavenizer builds Forge against. Forge 61 runs Mojang's official names at
# runtime (no reobfuscation), so the shared source compiles against it as written, as on the other Forge nodes.
minecraft_version=1.21.11
# forge_version = the dev COMPILE build of MinecraftForge 1.21.11 (the newest 61.x build on maven.minecraftforge.net on
# 2026-11-21). Not a player-facing requirement (that is forge_version_range below).
forge_version=61.2.5
# The player-facing minimums the shipped mods.toml declares: Forge 61.1.x (the x.1.0 floor the other Forge lines take; not yet
# bisected upward), the FML language-provider version (Forge's major number) and the Minecraft line (one version: the next
# release was the 26.1 CalVer rename).
forge_version_range=[61.1.0,62)
forge_loader_version_range=[61,)
mc_dep_range=[1.21.11,1.22)
# pack_fields = the pack-format members of the jar's own pack.mcmeta. 1.21.11's version.json says resource major 75, data
# major 94, and one file serves both pack types, but vanilla 1.21.11 validates it per type (PackFormat.validate): a data
# pack whose min_format is 81 or lower must also carry supported_formats and pack_format ("Couldn't load ... pack
# metadata" otherwise, measured with 75..94), while a resource pack whose min_format is above 64 must not carry
# supported_formats. The one range both accept starts at 64, the last resource format before min/max: 64..94 with the
# old fields matching it. Forge's mods.toml keeps the jar on 1.21.11, so the wider range is never read elsewhere.
pack_fields="min_format": 64, "max_format": 94, "supported_formats": [64, 94], "pack_format": 64

# withmod.opac = the Open Parties and Claims build the shared source compiles against on this node (its Forge build for the
# 1.21.11 line, forge-1.21.11-0.33.0; lib.compat.claims.OpenPartiesAndClaims, pulled into the compile for ForgeProtection).
# Compile-only here: the node has no -PwithMods runtime yet.
withmod.opac=maven.modrinth:open-parties-and-claims:kRHUQaFz
