# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 21.11 line (the SessionStart
# hook flags when it falls behind). It is NOT the player-facing requirement, which is
# neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=1.21.11
neo_version=21.11.45
jei_version=27.4.0.22

# 1.21.11 is the last Java-21 / pre-CalVer MC version. This node exists for the cross-cliff
# differences from the 26.1.x line (chiefly the 26.1 GUI-render refactor), expressed as //? if
# directives in the shared source tree.
java_version=21

# This node ships as the 1.21.11 jar — a single MC version (the next release was the 26.1 CalVer
# rename, not 1.21.12), built against NeoForge 21.11.42. Range floors at the build version.
neo_dep_range=[21.11.42,21.12)
mc_dep_range=[1.21.11,1.22)
