# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 21.11 line (the SessionStart
# hook flags when it falls behind). It is NOT the player-facing requirement, which is
# neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=1.21.11
neo_version=21.11.48
jei_version=27.4.0.22
# guideme_version = the GuideME build for that MC, loaded only by dev runs given -PwithGuideMe.
guideme_version=21.11.1-beta
rei_version=21.11.816
architectury_version=19.0.1

# 1.21.11 is the last Java-21 / pre-CalVer MC version. This node exists for the cross-cliff
# differences from the 26.1.x line (chiefly the 26.1 GUI-render refactor), expressed as //? if
# directives in the shared source tree.
java_version=21

# This node ships as the 1.21.11 jar — a single MC version (the next release was the 26.1 CalVer
# rename, not 1.21.12), built against NeoForge 21.11.42. Range floors at the build version.
neo_dep_range=[21.11.42,21.12)
mc_dep_range=[1.21.11,1.22)
# curios_version / accessories_version: the accessory-slot mods compiled against (BC's AccessorySlots); Accessories has no build past 1.21.10.
curios_version=14.0.0+1.21.11

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac neoforge-1.21.11-0.33.0, flan 1.21.11-1.12.7-neoforge, energizedpower 1.21.11-2.15.14-neoforge,
# tomsstorage 1.21.11-2.8.1, lithium mc1.21.11-0.21.4-neoforge, sodium mc1.21.11-0.8.15-beta.1-neoforge,
# iris 1.10.8+1.21.11-neoforge, immediatelyfast 1.14.3+1.21.11-neoforge, ftbchunks 2111.1.1
# ftbchunks (maven.ftb.dev) is FTB Chunks with FTB Library and FTB Teams, the builds its POM names, plus Architectury where
# the line needs it. The neoforge jars are self-contained: FTB's common jars are merged into them (listing both would
# put every class on the classpath twice) and the libraries ride inside FTB Library.
withmod.opac=maven.modrinth:open-parties-and-claims:YQSg80UG
withmod.flan=maven.modrinth:flan:gbljjgY1
withmod.energizedpower=maven.modrinth:energized-power:ojv4KPWQ
withmod.tomsstorage=maven.modrinth:toms-storage:Cl6WdkOf
withmod.lithium=maven.modrinth:lithium:M93zf1Gr
withmod.sodium=maven.modrinth:sodium:sVLtC9EW
withmod.iris=maven.modrinth:iris:6zJsI0eO;maven.modrinth:sodium:sVLtC9EW
withmod.immediatelyfast=maven.modrinth:immediatelyfast:jaBvDEKq
withmod.ftbchunks=dev.ftb.mods:ftb-chunks-neoforge:2111.1.1;dev.ftb.mods:ftb-library-neoforge:2111.1.0;dev.ftb.mods:ftb-teams-neoforge:2111.1.0;dev.architectury:architectury-neoforge:19.0.1
# curios: the full Curios jar of curios_version above (the compile-only pin is its api jar); keep the two in step.
# The goggles-curios smoke scenario asks for it (`curios replace ...` is a command of the full mod).
withmod.curios=top.theillusivec4.curios:curios-neoforge:14.0.0+1.21.11
