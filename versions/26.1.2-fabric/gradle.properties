# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 26.1.2-fabric is the Fabric node of the 26.1 line: the same build as 26.3-fabric (whose file explains each pin), against
# 26.1.2's Minecraft, Fabric API and mods. Java 25, inherited from the root java_version.
loader=fabric
minecraft_version=26.1.2
fabric_loader_version=0.20.1
fabric_api_version=0.155.3+26.1.2
fabric_loader_dep_range=>=0.19.4
fabric_api_dep_range=>=0.155.3+26.1.2
# Forge Config API Port 26.1.5 for Fabric (Modrinth version id; tagged for 26.1, 26.1.1 and 26.1.2).
forge_config_api_port_version=jUe0ucoE
forge_config_api_port_dep_range=>=26.1.5
jei_version=29.53.0.115
rei_version=26.1.819
rei_basic_math_version=0.6.1
rei_architectury_version=20.0.6
mod_menu_version=18.0.2
team_reborn_energy_version=5.0.0
common_protection_api_version=2.0.0
common_protection_api_dep_range=>=2.0.0

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac fabric-26.1.2-0.33.0, flan 26.1.2-1.12.8-fabric, energizedpower 3.0.7+26.1.x-fabric,
# techreborn 6.0.5, irontanks 3.3.1+mc26.1.2.fabric, tomsstorage 26.1-2.10.3-fabric, extendeddrawers 5.0.0+mc.26.1,
# lithium mc26.1.2-0.24.7-fabric, sodium mc26.1.2-0.9.2-fabric, iris 1.11.4+26.1-fabric,
# immediatelyfast 1.15.3+26.1-fabric, c2me 0.4.0-alpha.0.71+26.1.2
# tre is Team Reborn Energy, the FE/RF API: on this node it is otherwise on the game-test runtime only, so this alias
# is what gives runClient and runServer FE (keep it equal to team_reborn_energy_version).
withmod.opac=maven.modrinth:open-parties-and-claims:HDDpeLJz
withmod.flan=maven.modrinth:flan:2Bv82VYI
withmod.energizedpower=maven.modrinth:energized-power:8athtrg0
withmod.techreborn=maven.modrinth:techreborn:odOcmoOg
withmod.irontanks=maven.modrinth:iron-tanks:2oGJwHGa
withmod.tomsstorage=maven.modrinth:toms-storage:9VRUBvKA
withmod.extendeddrawers=maven.modrinth:extended-drawers:QkTa8nh5
withmod.lithium=maven.modrinth:lithium:Oqq8TOAV
withmod.sodium=maven.modrinth:sodium:tZQ3jqnf
withmod.iris=maven.modrinth:iris:sZbVsl2Q;maven.modrinth:sodium:tZQ3jqnf
withmod.immediatelyfast=maven.modrinth:immediatelyfast:xOA9hbpf
withmod.c2me=maven.modrinth:c2me-fabric:Hzge5Rlo
withmod.tre=teamreborn:energy:5.0.0
