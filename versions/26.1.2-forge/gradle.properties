# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 26.1.2-forge is a MinecraftForge port node (#209 slice F8, docs/forge-port.md): the same build as 26.3-forge (whose file
# explains each pin) on the 26.1 line, Forge 64 (EventBus 7). This is MinecraftForge, NOT NeoForge (the bare 26.1.2 node). It
# compiles all of src/main/java bar the recipe-viewer plugin packages (no jei_version / rei_version: no Forge build of either
# is wired). Dev runs: :26.1.2-forge:runServer, :26.1.2-forge:runClient, :26.1.2-forge:runGameTest. Java 25 (root java_version).
loader=forge

minecraft_version=26.1.2
# forge_version = the dev COMPILE build of MinecraftForge 26.1.2 (the newest 64.x build on maven.minecraftforge.net on
# 2026-11-21; McDevBridge's 26.1.2-forge node pins the same). Not a player-facing requirement (forge_version_range below).
forge_version=64.1.6
# The player-facing minimums the shipped mods.toml declares: Forge 64.1.x (64.1.0 is the first build of the 64.1
# stabilisation line; not yet bisected upward), the FML language-provider version (Forge's major number) and the line.
# Forge publishes 64.x for 26.1.2 only, so the range names 26.1.2 alone (the NeoForge 26.1.2 jar spans 26.1.x).
forge_version_range=[64.1.0,65)
forge_loader_version_range=[64,)
mc_dep_range=[26.1.2,26.2)
# pack_fields = the pack-format members of the jar's own pack.mcmeta: 26.1.2's version.json says resource major 84, data
# major 101, and one pack.mcmeta covers both.
pack_fields="min_format": 84, "max_format": 101

# withmod.opac = the Open Parties and Claims build the shared source compiles against on this node (its Forge build for the
# 26.1.2 line, forge-26.1.2-0.33.0; lib.compat.claims.OpenPartiesAndClaims, pulled into the compile for ForgeProtection), and what
# `-PwithMods=opac` puts on the dev runtime. That build requires Forge Config API Port and Forge ships none, so the alias
# carries its Forge build too (26.1.5, #228). The first coordinate is the compile pin (WithMods.compileCoordinate).
withmod.opac=maven.modrinth:open-parties-and-claims:DAyvM9ta;maven.modrinth:forge-config-api-port:i7zweACx
