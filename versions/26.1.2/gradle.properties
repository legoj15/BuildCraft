# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 26.1.2 line (the SessionStart
# hook, scripts/neoforge-version-check.sh, flags when it's behind — bumping is routine). It is NOT the
# player-facing requirement, which is neo_dep_range below (the empirically-verified floor). Keeping the
# two separate is deliberate: this pin moves forward freely without ever narrowing what players need.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=26.1.2
neo_version=26.1.2.108
jei_version=29.5.0.26

# This single node ships as the universal 26.1.x jar: version-agnostic code (reflection +
# old GUI getters, see lib.misc.BreakEventCompat) runs on 26.1, 26.1.1 and 26.1.2 alike, so the
# dependency ranges span the whole 26.1 line, even though the jar is filename-tagged +mc26.1.2
# (the actively-supported patch; 26.1/26.1.1 are EOL but the jar still loads on them).
neo_dep_range=[26.1.0,26.2)
mc_dep_range=[26.1.0,26.2)
