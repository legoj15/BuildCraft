# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 26.1.2 line (the SessionStart
# hook, scripts/neoforge-version-check.sh, flags when it's behind — bumping is routine). It is NOT the
# player-facing requirement, which is neo_dep_range below (the empirically-verified floor). Keeping the
# two separate is deliberate: this pin moves forward freely without ever narrowing what players need.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=26.1.2
neo_version=26.1.2.126
jei_version=29.5.0.26
# guideme_version = the GuideME build for that MC, loaded only by dev runs given -PwithGuideMe.
guideme_version=26.1.15-beta
rei_version=26.1.819
architectury_version=20.1.17

# This single node ships as the universal 26.1.x jar: version-agnostic code (reflection +
# old GUI getters, see platform.neoforge.NeoForgeBreakEvent) runs on 26.1, 26.1.1 and 26.1.2 alike, so the
# dependency ranges span the whole 26.1 line, even though the jar is filename-tagged +mc26.1.2
# (the actively-supported patch; 26.1/26.1.1 are EOL but the jar still loads on them).
neo_dep_range=[26.1.0,26.2)
mc_dep_range=[26.1.0,26.2)
# curios_version / accessories_version: the accessory-slot mods compiled against (BC's AccessorySlots); Accessories has no build past 1.21.10.
curios_version=15.0.0+26.1.2

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac neoforge-26.1.2-0.33.0, flan 26.1.2-1.12.8-neoforge, energizedpower 3.0.7+26.1.x-neoforge,
# irontanks 3.3.1+mc26.1.2.neoforge, tomsstorage 26.1-2.10.3, lithium mc26.1.2-0.24.7-neoforge,
# sodium mc26.1.2-0.9.2-neoforge, iris 1.11.4+26.1-neoforge, immediatelyfast 1.15.3+26.1-neoforge,
# ftbchunks 26.1.2.11, modernfix 5.27.27+mc26.1.2 (its dynamic_resources option is off unless config/modernfix-mixins.properties
# in the run folder sets mixin.perf.dynamic_resources=true; the smoke runner writes that whenever modernfix is loaded)
# ftbchunks (maven.ftb.dev) is FTB Chunks with FTB Library and FTB Teams, the builds its POM names, plus Architectury where
# the line needs it. The neoforge jars are self-contained: FTB's common jars are merged into them (listing both would
# put every class on the classpath twice) and the libraries ride inside FTB Library.
withmod.opac=maven.modrinth:open-parties-and-claims:yWoWl0Ln
withmod.flan=maven.modrinth:flan:McqGkNc0
withmod.energizedpower=maven.modrinth:energized-power:CAFGzkOP
withmod.irontanks=maven.modrinth:iron-tanks:DQ8FM9VN
withmod.tomsstorage=maven.modrinth:toms-storage:6dinsQOX
withmod.lithium=maven.modrinth:lithium:eZ0KJiEA
withmod.sodium=maven.modrinth:sodium:zg4YQ9EL
withmod.iris=maven.modrinth:iris:qE5Y7GrZ;maven.modrinth:sodium:zg4YQ9EL
withmod.modernfix=maven.modrinth:modernfix:J49h1v4I
withmod.immediatelyfast=maven.modrinth:immediatelyfast:adbrNJLm
withmod.ftbchunks=dev.ftb.mods:ftb-chunks-neoforge:26.1.2.11;dev.ftb.mods:ftb-library-neoforge:26.1.2.12;dev.ftb.mods:ftb-teams-neoforge:26.1.2.4
# curios: the full Curios jar of curios_version above (the compile-only pin is its api jar); keep the two in step.
# The goggles-curios smoke scenario asks for it (`curios replace ...` is a command of the full mod).
withmod.curios=top.theillusivec4.curios:curios-neoforge:15.0.0+26.1.2
