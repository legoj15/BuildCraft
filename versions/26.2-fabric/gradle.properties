# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 26.2-fabric is the Fabric node of the 26.2 line: the same build as 26.3-fabric (whose file explains each pin), against
# 26.2's Minecraft, Fabric API and mods. Java 25, inherited from the root java_version.
loader=fabric
minecraft_version=26.2
fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2
fabric_loader_dep_range=>=0.19.4
fabric_api_dep_range=>=0.161.0+26.2
# Forge Config API Port 26.2.1 for Fabric (Modrinth version id).
forge_config_api_port_version=rSd3GiG8
forge_config_api_port_dep_range=>=26.2.1
jei_version=30.48.0.244
rei_version=26.2.821
rei_basic_math_version=0.6.1
rei_architectury_version=21.0.2
mod_menu_version=20.0.3
team_reborn_energy_version=5.0.0
common_protection_api_version=2.0.0
common_protection_api_dep_range=>=2.0.0

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac fabric-26.2-0.33.0, flan 26.2-1.12.8-fabric, energizedpower 3.0.7+26.2.x-fabric, techreborn 6.1.1,
# irontanks 3.3.1+mc26.2.fabric, tomsstorage 26.2-2.11.4-fabric, extendeddrawers 5.1.0+mc.26.2,
# lithium mc26.2-0.25.3-fabric, sodium mc26.2-0.9.2-fabric, iris 1.11.4+26.2-fabric,
# immediatelyfast 1.16.5+26.2-fabric, c2me 0.4.2-alpha.0.67+26.2
# tre is Team Reborn Energy, the FE/RF API: on this node it is otherwise on the game-test runtime only, so this alias
# is what gives runClient and runServer FE (keep it equal to team_reborn_energy_version).
withmod.opac=maven.modrinth:open-parties-and-claims:Z5TkbNzv
withmod.flan=maven.modrinth:flan:qJDOZxe5
withmod.energizedpower=maven.modrinth:energized-power:dyRtYNO3
withmod.techreborn=maven.modrinth:techreborn:YsPVZIsK
withmod.irontanks=maven.modrinth:iron-tanks:MM1GM0l0
withmod.tomsstorage=maven.modrinth:toms-storage:cwif4LaZ
withmod.extendeddrawers=maven.modrinth:extended-drawers:1GrnCGEz
withmod.lithium=maven.modrinth:lithium:f7vZ0VWU
withmod.sodium=maven.modrinth:sodium:xJZxADzI
withmod.iris=maven.modrinth:iris:gxZWWnKH;maven.modrinth:sodium:xJZxADzI
withmod.immediatelyfast=maven.modrinth:immediatelyfast:pMWERcSu
withmod.c2me=maven.modrinth:c2me-fabric:uR0wg5ss
withmod.tre=teamreborn:energy:5.0.0
