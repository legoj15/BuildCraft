# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 26.2-forge is a MinecraftForge port node (#209 slice F8, docs/forge-port.md): the same build as 26.3-forge (whose file
# explains each pin) on the 26.2 line, Forge 65 (EventBus 7). This is MinecraftForge, NOT NeoForge (the bare 26.2 node). It
# compiles all of src/main/java bar the recipe-viewer plugin packages (no jei_version / rei_version: no Forge build of either
# is wired). Dev runs: :26.2-forge:runServer, :26.2-forge:runClient, :26.2-forge:runGameTest. Java 25 (root java_version).
loader=forge

minecraft_version=26.2
# forge_version = the dev COMPILE build of MinecraftForge 26.2 (the newest 65.x build on maven.minecraftforge.net on
# 2026-11-21; McDevBridge's 26.2-forge node pins the same). Not a player-facing requirement (forge_version_range below).
forge_version=65.1.6
# The player-facing minimums the shipped mods.toml declares: Forge 65.1.x (65.1.0 is the first build of the 65.1
# stabilisation line; not yet bisected upward), the FML language-provider version (Forge's major number) and the line.
forge_version_range=[65.1.0,66)
forge_loader_version_range=[65,)
mc_dep_range=[26.2,26.3)
# pack_fields = the pack-format members of the jar's own pack.mcmeta: 26.2's version.json says resource major 88, data
# major 107, and one pack.mcmeta covers both.
pack_fields="min_format": 88, "max_format": 107

# withmod.opac = Open Parties and Claims' Forge build for the 26.2 line (forge-26.2-0.33.0), compile-only for
# lib.compat.claims.OpenPartiesAndClaims (ForgeProtection). The node has no -PwithMods runtime yet.
withmod.opac=maven.modrinth:open-parties-and-claims:lgOCpJtz
# The smoke runner reads this: scenarios that boot with the alias are skipped here, not failed (#228).
withmods_compile_only=opac
