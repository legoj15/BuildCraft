# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 26.2 line — which is still
# PRE-RELEASE, so every build carries the "-beta" suffix (the SessionStart hook flags when it's
# behind; bumping is routine). It is NOT the player-facing requirement, which is neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=26.2
neo_version=26.2.0.8-beta
jei_version=30.0.0.1

# 26.2 is the next CalVer major line after 26.1 (Java 25, inherits root java_version). This node
# exists to evaluate/add 26.2 support. As a >=26.1.2 node it reuses the 26.1.x code path for every
# existing //? if directive; genuine 26.1->26.2 cliffs (if any) get new directives in the shared tree.

# This node ships as the 26.2 jar. Range covers the 26.2 line.
neo_dep_range=[26.2.0,26.3)
mc_dep_range=[26.2,26.3)
