# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 26.2 line (the SessionStart
# hook flags when it's behind; bumping is routine). It is NOT the player-facing requirement, which is
# neo_dep_range below. The 26.2 line went STABLE at 26.2.0.57, so pins no longer carry "-beta".
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=26.2
neo_version=26.2.0.93
jei_version=30.42.0.236
# guideme_version = the GuideME build for that MC, loaded only by dev runs given -PwithGuideMe.
guideme_version=26.2.2-alpha
rei_version=26.2.821
architectury_version=21.1.12

# 26.2 is the next CalVer major line after 26.1 (Java 25, inherits root java_version). This node
# exists to evaluate/add 26.2 support. As a >=26.1.2 node it reuses the 26.1.x code path for every
# existing //? if directive; genuine 26.1->26.2 cliffs (if any) get new directives in the shared tree.

# This node ships as the 26.2 jar. Range covers the 26.2 line.
neo_dep_range=[26.2.0,26.3)
mc_dep_range=[26.2,26.3)
# curios_version / accessories_version: the accessory-slot mods compiled against (BC's AccessorySlots); Accessories has no build past 1.21.10.
curios_version=16.0.0+26.2

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac neoforge-26.2-0.33.0, flan 26.2-1.12.8-neoforge, energizedpower 3.0.7+26.2.x-neoforge,
# irontanks 3.3.1+mc26.2.neoforge, tomsstorage 26.2-2.11.3, lithium mc26.2-0.25.3-neoforge,
# sodium mc26.2-0.9.2-neoforge, iris 1.11.4+26.2-neoforge, immediatelyfast 1.16.5+26.2-neoforge
withmod.opac=maven.modrinth:open-parties-and-claims:5nVoZqbg
withmod.flan=maven.modrinth:flan:H9NbCnik
withmod.energizedpower=maven.modrinth:energized-power:J2hCJV6Z
withmod.irontanks=maven.modrinth:iron-tanks:4XinG2Jr
withmod.tomsstorage=maven.modrinth:toms-storage:3n9VMENQ
withmod.lithium=maven.modrinth:lithium:J9CowDXK
withmod.sodium=maven.modrinth:sodium:DmnNKsfS
withmod.iris=maven.modrinth:iris:k55HdONq;maven.modrinth:sodium:DmnNKsfS
withmod.immediatelyfast=maven.modrinth:immediatelyfast:4C8Vb9ab
