# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 26.3-fabric is the Fabric node of the 26.3 line (#98, docs/platform-layer.md): all of BuildCraft on Fabric Loader and
# Fabric API, built by bc.fabric in buildSrc into BuildCraftRedux-<v>+mc26.3-fabric.jar, which buildAndCollect puts
# beside the NeoForge jars (nothing ships until the user says so).
# Java 25, inherited from the root java_version, like every 26.x node.

# The loader this node builds against. Never parsed out of the node name; it picks bc.fabric and makes the
# Stonecutter constant `fabric` true (`//? if fabric {`) and `neoforge` false.
loader=fabric

# minecraft_version = the MC version Loom provides (unobfuscated on 26.x, so Loom does not remap and there is no
# mappings pin). It matches the 26.3 NeoForge node's.
minecraft_version=26.3
# fabric_loader_version = the dev COMPILE/run build of Fabric Loader, held at the newest release (maven.fabricmc.net,
# 2026-11-03). fabric_api_version = the newest Fabric API build for 26.3 on the same date. The SessionStart hook
# flags when either is behind, and bumping them is routine: they are NOT the player-facing requirement.
fabric_loader_version=0.20.1
fabric_api_version=0.165.2+26.3
# fabric_loader_dep_range / fabric_api_dep_range = the player-facing minimums, expanded into the `depends` of the
# shipped fabric.mod.json (the Fabric twins of the NeoForge nodes' neo_dep_range). Bisected 2026-11-06 (#124): BC's
# main code compiles against Fabric API 0.155.0+26.3 and later (0.154.x lacks FabricTooltipFlag, the interface Fabric
# API injects into vanilla TooltipFlag), but the binding floor is Forge Config API Port 26.3.1, which requires Loader
# >=0.19.4 and Fabric API >=0.160.6; all 937 Fabric game tests pass on exactly those two builds. Raise a floor only
# when the jar really needs a newer build (re-run the bisect: set the dev pins AND these ranges to the candidate,
# then :26.3-fabric:runGameTest), so a routine bump of the dev pins never raises what a Fabric player must install.
fabric_loader_dep_range=>=0.19.4
fabric_api_dep_range=>=0.160.6+26.3
# forge_config_api_port_version = Forge Config API Port 26.3.1 for Fabric, by its Modrinth version id (the version
# number 26.3.1 is shared by its NeoForge and Forge files, so only the id names the Fabric jar unambiguously).
# It provides NeoForge's ModConfigSpec/ModConfig on Fabric, so BC's config classes compile and run unchanged.
forge_config_api_port_version=JpKvrr9J
# Recipe viewers on Fabric, the same builds as the 26.3 NeoForge node: jei_version (maven.blamejared.com,
# jei-26.3-fabric*) and rei_version (maven.shedaniel.me, RoughlyEnoughItems-*-fabric).
jei_version=31.16.0.86
rei_version=26.3.824
# mod_menu_version = Mod Menu (maven.terraformersmc.com) in the dev client only (localRuntime): Fabric has no mod
# list of its own, and Mod Menu's config button is how a player reaches BC's config screen. Not shipped or depended on.
mod_menu_version=21.0.0
