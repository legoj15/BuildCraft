# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# 26.3-forge is the MinecraftForge port's node (#209, docs/forge-port.md): all of BuildCraft on Forge, built by bc.forge in
# buildSrc into BuildCraftRedux-<v>+mc26.3-forge.jar, which buildAndCollect puts beside the other loaders' jars (nothing ships
# until the user says so). This is MinecraftForge, NOT NeoForge (the bare 26.3 node). It compiles all of src/main/java bar
# the recipe-viewer plugin packages (it has no jei_version / rei_version: neither viewer has a Forge build for 26.3; see
# bc.forge in buildSrc). Dev runs: :26.3-forge:runServer boots the dedicated server (slice F4); no game tests or client yet.
# Java 25, inherited from the root java_version, like every 26.x node.

# The loader this node builds against. Never parsed out of the node name; it picks bc.forge and makes the
# Stonecutter constant `forge` true (`//? if forge {`) and `neoforge` and `fabric` false.
loader=forge

# minecraft_version = the MC version ForgeGradle's mavenizer builds Forge against (Mojang's official names, unobfuscated on
# 26.x, so there is no reobfuscation and no mappings pin beyond "official"). It matches the 26.3 NeoForge node's.
minecraft_version=26.3
# forge_version = the dev COMPILE build of MinecraftForge for that line (maven.minecraftforge.net, the newest build on
# 2026-11-16; the dependency is net.minecraftforge:forge:<minecraft_version>-<forge_version>). It is not a player-facing
# requirement (that is forge_version_range below).
forge_version=66.1.8
# forge_version_range / forge_loader_version_range / mc_dep_range = the player-facing minimums the shipped mods.toml declares
# (the Forge twins of the NeoForge nodes' neo_dep_range / mc_dep_range): Forge 66.1.x on the 26.3 line, the FML
# language-provider version (Forge's major number), and the Minecraft line. They are their own properties so a routine bump
# of the dev pin above never raises what a Forge player must install. 66.1.0 is Forge's first 26.3 build; not yet bisected
# upward the way the NeoForge floors are (#209 F5 does that against the game tests).
forge_version_range=[66.1.0,67)
forge_loader_version_range=[66,)
mc_dep_range=[26.3,26.4)
# pack_fields = the pack-format members of the jar's own pack.mcmeta (Forge, unlike NeoForge, needs one or FML warns on the
# title screen). 26.x writes min_format/max_format where 1.21.1 writes pack_format. 26.3's version.json says resource major 97,
# data major 121, and one pack.mcmeta covers both, so the range is 97..121 (McDevBridge's 26.3-forge node carries the same).
pack_fields="min_format": 97, "max_format": 121

# withmod.opac = the Open Parties and Claims build the shared source compiles against on this node (its Forge build for the 26.3 line;
# lib.compat.claims.OpenPartiesAndClaims, pulled into the compile for ForgeProtection). Compile-only here: the node has no -PwithMods runtime yet.
withmod.opac=maven.modrinth:open-parties-and-claims:kvQ7M7h5
