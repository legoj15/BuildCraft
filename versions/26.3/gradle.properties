# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 26.3 line (the SessionStart
# hook flags when it's behind; bumping is routine). It is NOT the player-facing requirement, which is
# neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=26.3
neo_version=26.3.0.101
jei_version=31.16.0.86
# guideme_version = the GuideME build for that MC, loaded only by dev runs given -PwithGuideMe.
guideme_version=26.3.4-alpha
# fallingtree_version = FallingTree (Modrinth maven, group maven.modrinth), loaded only by runs given -PwithFallingTree.
# One jar for NeoForge and Fabric; the 26.3 build, not the metadata's `latest` (a 1.21 build).
fallingtree_version=26.3-26.3.0.4
rei_version=26.3.824
architectury_version=22.0.5

# 26.3 is the next CalVer line after 26.2 (Java 25, inherits root java_version). This node exists to
# evaluate/add 26.3 support. As a >=26.2 node it reuses the 26.2 code path for every existing
# //? if directive; genuine 26.2->26.3 cliffs get new directives in the shared tree.

# This node ships as the 26.3 jar. Floor bisected 2026-10-22: 26.3.0.38-beta is the first build with
# TextureAtlasSprite#getPixelARGB (FluidShardTintSource); 754 game tests pass on it with BC alone.
neo_dep_range=[26.3.0.38-beta,26.4)
mc_dep_range=[26.3,26.4)
# curios_version / accessories_version: the accessory-slot mods compiled against (BC's AccessorySlots); Accessories has no build past 1.21.10.
curios_version=17.0.0-beta.3+26.3

# Opt-in third-party mods for dev runs (-PwithMods, #186).
# `-PwithMods=opac,lithium` puts each alias's coordinates on this node's runClient, runServer and game-test runtime
# (buildcraft.gradle.WithMods); without the property none of it is resolved. An alias is the mod plus every library it
# needs that the runtime does not already carry, `;`-separated and never transitive. Modrinth coordinates name a version
# by its id (a version number is shared by a mod's loaders). A mod with no build for this line and loader has no alias.
# Versions: opac neoforge-26.3-0.33.0, flan 26.3-1.12.8-neoforge, energizedpower 3.0.7+26.3.x-neoforge,
# tomsstorage 26.3-2.12.3, lithium mc26.3-0.26.3-neoforge, sodium mc26.3-0.9.3-beta.5-neoforge,
# iris 1.11.7+26.3-neoforge, immediatelyfast 1.17.1+26.3-neoforge
withmod.opac=maven.modrinth:open-parties-and-claims:VhEuA4pj
withmod.flan=maven.modrinth:flan:1Bik8U9i
withmod.energizedpower=maven.modrinth:energized-power:tKLim16Z
withmod.tomsstorage=maven.modrinth:toms-storage:WoT7ihuc
withmod.lithium=maven.modrinth:lithium:2BP6jqRA
withmod.sodium=maven.modrinth:sodium:CT6qQx01
withmod.iris=maven.modrinth:iris:Ag5S66CF;maven.modrinth:sodium:CT6qQx01
withmod.immediatelyfast=maven.modrinth:immediatelyfast:4SovUFpn
# curios: the full Curios jar of curios_version above (the compile-only pin is its api jar); keep the two in step.
# The goggles-curios smoke scenario asks for it (`curios replace ...` is a command of the full mod).
withmod.curios=top.theillusivec4.curios:curios-neoforge:17.0.0-beta.3+26.3
