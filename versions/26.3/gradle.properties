# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 26.3 line (the SessionStart
# hook flags when it's behind; bumping is routine). It is NOT the player-facing requirement, which is
# neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=26.3
neo_version=26.3.0.101
jei_version=31.16.0.86
# guideme_version = the GuideME build for that MC, loaded only by dev runs given -PwithGuideMe.
guideme_version=26.3.4-alpha
# fallingtree_version = FallingTree (Modrinth maven, group maven.modrinth), loaded only by runs given -PwithFallingTree.
# One jar for NeoForge and Fabric; the 26.3 build, not the metadata's `latest` (a 1.21 build).
fallingtree_version=26.3-26.3.0.4
rei_version=26.3.824
architectury_version=22.0.5

# 26.3 is the next CalVer line after 26.2 (Java 25, inherits root java_version). This node exists to
# evaluate/add 26.3 support. As a >=26.2 node it reuses the 26.2 code path for every existing
# //? if directive; genuine 26.2->26.3 cliffs get new directives in the shared tree.

# This node ships as the 26.3 jar. Floor bisected 2026-10-22: 26.3.0.38-beta is the first build with
# TextureAtlasSprite#getPixelARGB (FluidShardTintSource); 754 game tests pass on it with BC alone.
neo_dep_range=[26.3.0.38-beta,26.4)
mc_dep_range=[26.3,26.4)
# curios_version / accessories_version: the accessory-slot mods compiled against (BC's AccessorySlots); Accessories has no build past 1.21.10.
curios_version=17.0.0-beta.3+26.3
