# Version pins — per-node; the build reads only these (root gradle.properties documents the scheme).
# neo_version is the dev COMPILE/run build, held at the newest on the 26.3 line (the SessionStart
# hook flags when it's behind; bumping is routine). It is NOT the player-facing requirement, which is
# neo_dep_range below.
# minecraft_version = target MC + jar "+mc" filename tag; jei_version = the JEI build for that MC.
minecraft_version=26.3
neo_version=26.3.0.95
jei_version=31.16.0.86

# 26.3 is the next CalVer line after 26.2 (Java 25, inherits root java_version). This node exists to
# evaluate/add 26.3 support. As a >=26.2 node it reuses the 26.2 code path for every existing
# //? if directive; genuine 26.2->26.3 cliffs get new directives in the shared tree.

# This node ships as the 26.3 jar. Range covers the 26.3 line.
neo_dep_range=[26.3.0,26.4)
mc_dep_range=[26.3,26.4)
